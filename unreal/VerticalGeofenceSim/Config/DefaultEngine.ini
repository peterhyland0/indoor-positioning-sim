[/Script/Engine.RendererSettings]
; grey-box sim: cheap rendering, deterministic timing matters more than looks
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False
r.AntiAliasingMethod=1
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.Nanite.ProjectEnabled=False
r.GenerateMeshDistanceFields=False

[/Script/Engine.Engine]
; sim logic is timer-driven; cap FPS so the editor does not spin the fans
bSmoothFrameRate=False

[SystemSettings]
t.MaxFPS=60

[/Script/Engine.CollisionProfile]
; ECC_GameTraceChannel1 = "Radio": beacon->phone line traces use this so workers, the hoist
; and beacons themselves are ignored while slabs/partitions block.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="Radio")
+Profiles=(Name="RadioBlocker",CollisionEnabled=QueryOnly,bCanModify=True,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Radio",Response=ECR_Block)),HelpMessage="Slabs and partitions: block Radio traces, ignore everything else.")
+Profiles=(Name="RadioTransparent",CollisionEnabled=QueryOnly,bCanModify=True,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Radio",Response=ECR_Ignore)),HelpMessage="Workers, beacons, hoist: invisible to Radio traces.")

